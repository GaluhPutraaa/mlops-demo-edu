name: CI/CD Pipeline
on:
  push:
    branches:
      - main

env:
  CDSW_DOMAIN: "https://ml-c2658fe4-6d5.mariapg.kfjr-x0dh.cloudera.site"
  PROJ_NAME: "cicd-mlops_8_5225805"

jobs:
  deploy-to-cml:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Get Project ID
        env:
          API_KEY: ${{ secrets.CML_API_KEY }}
        run: |
          set -euo pipefail

          PROJECT_ID=$(curl -sS -G "$CDSW_DOMAIN/api/v2/projects" \
            -H "accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            --data-urlencode "search_filter={\"name\":\"$PROJ_NAME\"}" \
            | jq -r '.projects[0].id // empty')

          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Project '$PROJ_NAME' tidak ketemu"
            exit 1
          fi

          echo "Project ID: $PROJECT_ID"
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Run Bootstrap Job
        env:
          API_KEY: ${{ secrets.CML_API_KEY }}
          JOB_NAME: "bootstrap"
        run: |
          set -euo pipefail

          JOBS=$(curl -sS -G "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs" \
            -H "accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            --data-urlencode "page_size=100")

          JOB_ID=$(echo "$JOBS" | jq -r --arg n "$JOB_NAME" '.jobs[] | select(.name==$n) | .id' | head -n1)

          if [ -z "$JOB_ID" ]; then
            echo "::error::Job '$JOB_NAME' tidak ketemu di project"
            echo "Jobs yang ada:"
            echo "$JOBS" | jq -r '.jobs[].name'
            exit 1
          fi

          echo "Job ID: $JOB_ID"
          RUN=$(curl -sS -X POST "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs/$JOB_ID/runs" \
            -H "accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json")

          echo "Response: $RUN"
          echo "$RUN" | jq -e '.id' > /dev/null || { echo "::error::Gagal trigger run"; exit 1; }

      - name: Wait for 30 Seconds
        run: sleep 30

      - name: Run Train Job
        env:
          API_KEY: ${{ secrets.CML_API_KEY }}
          JOB_NAME: "train"
        run: |
          set -euo pipefail

          JOBS=$(curl -sS -G "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs" \
            -H "accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            --data-urlencode "page_size=100")

          JOB_ID=$(echo "$JOBS" | jq -r --arg n "$JOB_NAME" '.jobs[] | select(.name==$n) | .id' | head -n1)

          if [ -z "$JOB_ID" ]; then
            echo "::error::Job '$JOB_NAME' tidak ketemu di project"
            echo "Jobs yang ada:"
            echo "$JOBS" | jq -r '.jobs[].name'
            exit 1
          fi

          echo "Job ID: $JOB_ID"
          RUN=$(curl -sS -X POST "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs/$JOB_ID/runs" \
            -H "accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json")

          echo "Response: $RUN"
          echo "$RUN" | jq -e '.id' > /dev/null || { echo "::error::Gagal trigger run"; exit 1; }
